<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64" fill="none">
  <defs>
    <linearGradient id="htlRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>
  <!-- High Node -->
  <polygon points="16,6 6,20 16,24 26,20" fill="#fbbf24" stroke="#fef08a" stroke-width="1" />
  <!-- 3D Connecting Vector Ribbon High -> Low -->
  <polygon points="18,18 24,14 62,42 56,46" fill="url(#htlRibbon)" stroke="#fda4af" stroke-width="0.8" />
  <!-- Low Node -->
  <polygon points="62,58 52,44 62,40 72,44" fill="#f43f5e" stroke="#fecdd3" stroke-width="1" />
  <text x="40" y="14" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="800" font-size="8">H→L</text>
</svg>
